name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. The gate builds the NIF, runs the C sanitizers, the static analyzer
# and dialyzer, so a superseded run is pure cost — the newest verdict is the one that counts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # See both VMs' results, not just the first one to fail.
      fail-fast: false
      matrix:
        # The two VM majors the project claims to support. Elixir is pinned to the
        # exact version .mise.toml pins, so a green run here means the same VM and
        # the same compiler the local gates were verified against.
        otp: ["27", "29"]
        elixir: ["1.20.4"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The build reads c_src/gumbo-parser/src (the pinned parser) and applies the
          # patch series to a copy of it, so the submodule has to be checked out.
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          # c_src and Makefile belong in the key: the NIF is a build input, and a cache
          # hit from a different submodule commit or a different patch series would hand
          # the suite a stale library instead of rebuilding it.
          key: ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-${{ hashFiles('mix.lock', 'Makefile', 'c_src/**') }}

      - run: mix deps.get --check-locked
      - run: mix compile --all-warnings --warnings-as-errors
      - run: mix test

  gate:
    name: mix ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The Makefile looks each tool up on PATH and falls back to `mise exec --`, which
      # CI does not install. LLVM arrives the apt.llvm.org way instead, so the three
      # `find_tool` lookups and the C compiler are named here. clang is the same major
      # version .mise.toml pins, and that matters: clang-format's output is
      # version-specific, and check-c-format compares against the committed .clang-format.
      CC: clang-23
      ANALYZER: clang-23
      CLANG_FORMAT: clang-format-23
      CLANG_TIDY: clang-tidy-23
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20.4"

      - name: Install LLVM 23
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          # `all` is load-bearing: the default package set is llvm-23's libraries and tools,
          # which leaves out clang and clang-tools — and clang-format-23 and clang-tidy-23
          # live in those. Without it this step succeeds while installing neither, and
          # check-c-format is the gate that fails, three steps later, on a missing tool.
          sudo /tmp/llvm.sh 23 all
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"

      # Print the versions the gate will actually use: a missing tool or a system clang of
      # another major stops here, naming itself, instead of inside an unrelated-looking gate.
      - name: Report the C toolchain
        run: |
          clang-23 --version
          clang-format-23 --version
          clang-tidy-23 --version

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp29.1.1-elixir1.20.4-${{ hashFiles('mix.lock', 'Makefile', 'c_src/**') }}

      - run: mix deps.get --check-locked

      # The project's whole gate, in one step, in the order mix.exs's ci alias runs it:
      # warnings-as-errors compile, format, credo --strict, unused-lock check, xref,
      # dialyzer, ex_dna, reach's smells plus the dead-code task, the covered suite in its
      # own VM (it fails below the threshold in mix.exs's test_coverage), the small-stack
      # suite in another VM, the teardown contract probe, the patch series and the patch
      # generator, the pinned-parser parity dump, the C stack guard, clang-analyzer,
      # clang-format, clang-tidy, the C lint and failure-return checks,
      # AddressSanitizer/UndefinedBehaviorSanitizer, a clean rebuild, and the allocation
      # failure sweep. Nothing here is a smoke test the local gate does not run.
      - run: mix ci

      # The number the README badge shows, and nothing else: codecov is here for visibility, so
      # its status checks and its PR comment are off in codecov.yml. The gate stays
      # coveralls.json's minimum_coverage, which the step above has just enforced — a second gate
      # would be a second source of truth for the same claim. No MIX_ENV is needed: cli/0's
      # preferred_envs already runs the coveralls tasks in :test.
      - name: Coverage for the badge
        run: mix coveralls.json

      - name: Upload the coverage report as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux
          path: |
            cover/excoveralls.json
            cover/*.html

      - name: Post coverage to Codecov
        # The bash uploader rather than codecov-cli, for the reason recorded in gilbertwong96's
        # longbridge workflow: the cli ships no Elixir/coveralls-format plugin and answers
        # "Found 0 coverage files to report" for this very file.
        #
        # Skipping when the secret is absent is deliberate: a missing upload must not turn a green
        # gate red, and the artifact above already uploaded keeps the data reachable until the
        # repo is enabled at codecov.io and the token is added as a secret.
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::notice::CODECOV_TOKEN not set - skipping the Codecov upload."
            echo "Enable https://codecov.io/gh/gilbertwong96/gumbo and add its token as a secret."
            exit 0
          fi
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov
          ./codecov --token "$CODECOV_TOKEN" --file ./cover/excoveralls.json
        continue-on-error: true

  # Every platform the project packages a NIF for, verified on each push. A platform that ships an
  # archive is a platform the suite has to keep passing on — otherwise the archive is a promise
  # nobody is checking. The whole gate runs on Ubuntu above; what has to hold everywhere is the
  # suite itself, so that is what this matrix runs.
  platforms:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20.4"

      - run: mix deps.get --check-locked
      - run: mix test

  # Windows is a job of its own because its steps have to run inside MSYS2's shell. elixir_make wants
  # a POSIX toolchain — make, a compiler, uname — which a Windows runner has in MSYS2 and not on the
  # PATH a pwsh step inherits; `shell:` cannot be templated or made conditional, so the only way to
  # say "these steps run in MSYS2" is a job whose default shell is MSYS2's.
  platforms-windows:
    name: test (x86_64-windows)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20.4"

      - name: MSYS2's make and mingw-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # MSYS2's own profile rebuilds PATH from its mount table, which drops the Windows PATH that
          # setup-beam put Elixir on — the first attempt here failed with `mix: command not found`.
          # inherit hands the Windows PATH through to the MSYS2 shell instead.
          path-type: inherit
          install: >-
            make
            mingw-w64-x86_64-gcc

      - run: mix deps.get --check-locked
      - run: mix test

  gate-macos:
    name: mix ci (macOS, pinned toolchain)
    # macOS runners bill at roughly ten times the Linux rate, so this job exists for one
    # reason: to tell a genuine failure apart from a platform difference. Restrict it with
    # a `paths` or `if` filter if that comparison is not worth the minutes on every push.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The project's own toolchain file, rather than a second set of pins: .mise.toml
      # names erlang 29.1.1, elixir 1.20.4-otp-29 and clang 23, so this job runs the gate
      # with the exact VM and the exact clang-format the committed .clang-format was
      # written for — and the Makefile's own tool lookup falls back to `mise exec --`,
      # which is another way of saying mise is the intended source of these tools.
      # (The ubuntu jobs use setup-beam and llvm.sh instead: mise would build Erlang from
      # source on Linux, and those jobs are there for the suite, not for that.)
      - uses: jdx/mise-action@v5
        with:
          install: false
      - run: mise trust
      - run: mise install

      # Homebrew's LLVM download and keg, so a rerun does not re-download 2 GB of it. The key
      # follows .mise.toml, where the clang major is pinned; if Homebrew's llvm@23 moves to a
      # newer build, `brew install` sees the restored keg as outdated and upgrades it rather
      # than letting a stale one stand.
      - name: Cache Homebrew's LLVM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/llvm@23
            /opt/homebrew/opt/llvm@23
          key: ${{ runner.os }}-brew-llvm23-${{ hashFiles('.mise.toml') }}

      # Homebrew's LLVM, because mise's clang is the compiler only: it ships no clang-format
      # and no clang-tidy, which is why .mise.toml names a Homebrew LLVM bin directory as the
      # place this project's tools come from (Homebrew keeps llvm keg-only, so that path has
      # to be said rather than inherited). This reproduces the local arrangement — Xcode's
      # clang compiles, LLVM 23's clang-format and clang-tidy judge the C — and $GITHUB_PATH
      # prepends, so the keg's tools win over the Xcode ones a runner already has.
      - name: Install LLVM's tools
        run: |
          brew install llvm@23
          echo "$(brew --prefix)/opt/llvm@23/bin" >> "$GITHUB_PATH"

      # Print what the gate will actually use, by the same PATH lookup the Makefile does:
      # a missing tool or a system clang of another major stops here, naming itself.
      - name: Report the C toolchain
        run: |
          clang --version
          clang-format --version
          clang-tidy --version

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mise-${{ hashFiles('mix.lock', 'Makefile', 'c_src/**', '.mise.toml') }}

      - run: mix deps.get --check-locked
      - run: mix ci
